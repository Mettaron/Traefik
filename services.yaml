# Registry of every Laba service on laba_network: add a service with one block here, nothing
# else in this repo names a service. Personal overrides (branch, real api_keys) go to the
# gitignored services.local.yaml (see services.local.yaml.example), like .env.local.
#
# A service is a repo created from template-symfony-service, cloned into Laba/Services/<name>;
# <name> is its SERVICE_NAME (.env): compose project laba_<name>, containers laba_<name>_app,
# laba_<name>_worker, laba_<name>_db.
#
# Fields (all optional except repo):
#   repo            GitHub repo, cloned as git@github.com:<repo>.git
#   db_port         host port of the service's database (127.0.0.1 only) for DB GUI clients;
#                   one series: 33061, 33062... Not used by the app itself.
#   local_host      host for a browser, default <name>.localhost. Its twin <name>.local is for
#                   server-to-server calls: inside a container curl resolves *.localhost to the
#                   container itself (RFC 6761), so a *_URL of another service must use .local.
#   staging_origin  where both hosts go when the service is not running locally (a Traefik
#                   fallback router, generated by `make gen`); empty: no fallback.
#   keys            the services this one calls: env var it declares -> the called service, e.g.
#                   `CMS_API_KEY: cms`. A key per pair: its real value is the called service's
#                   `api_keys: {<this service>: ...}` in services.local.yaml (never here).
#                   `make secrets` writes it to both: this service's CMS_API_KEY and the called
#                   service's API_CLIENT_<THIS>_KEY (its laba_service.api_access reads it).
#
# groups: shorthand for SERVICES=, `<group>: <services separated by spaces>`, e.g.
# `make up SERVICES=payment`. Not recursive.

groups:
  # payment: payment-gateway payment-merchant

# example:
#   repo: Mettaron/example-service
#   db_port: 33061
#   staging_origin: https://example.stage.laba.dev
#   keys:
#     CMS_API_KEY: cms
