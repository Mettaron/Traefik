# Shared by every Laba service: `make traefik-up` (or `make up`, which starts it first).
# Its <service>.localhost / <service>.local aliases on laba_network are generated from
# services.yaml into generated/compose.aliases.yml (see .env COMPOSE_FILE).
networks:
  laba_network:
    name: laba_network
    external: true # created by `make network`

services:
  laba_traefik:
    image: traefik:v3
    container_name: laba_traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080" # dashboard
    networks:
      - laba_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./dynamic:/dynamic:ro
      - ./logs:/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.entrypoints=http"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
    environment:
      - TZ=UTC

  # Redis cache shared between services (laba_client.global_cache): the owner service writes,
  # the others read. Services reach it on laba_network: REDIS_CACHE_DSN=redis://laba_redis:6379.
  # A cache only: nothing is saved to disk, a restart starts it empty.
  laba_redis:
    image: redis:7.2-alpine
    container_name: laba_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379" # for GUI clients on the host
    networks:
      - laba_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Web UI of laba_redis: keys, values, TTL, edit/delete. http://redis.localhost
  # The laba_redis connection is preconfigured (RI_REDIS_*); its settings are kept in a volume.
  laba_redisinsight:
    image: redis/redisinsight:latest
    container_name: laba_redisinsight
    restart: unless-stopped
    depends_on:
      laba_redis:
        condition: service_healthy
    environment:
      - RI_REDIS_HOST=laba_redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=laba_redis
    volumes:
      - laba_redisinsight:/data
    networks:
      - laba_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redisinsight.entrypoints=http"
      - "traefik.http.routers.redisinsight.rule=Host(`redis.localhost`)"
      - "traefik.http.services.redisinsight.loadbalancer.server.port=5540"

volumes:
  laba_redisinsight:
    name: laba_redisinsight
