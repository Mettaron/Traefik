# Shared by every Laba service: `make traefik-up` (or `make up`, which starts it first).
# Its <service>.localhost / <service>.local aliases on laba_network are generated from
# services.yaml into generated/compose.aliases.yml (see .env COMPOSE_FILE).
networks:
  laba_network:
    name: laba_network
    external: true # created by `make network`

services:
  laba_traefik:
    image: traefik:v3.7.19
    container_name: laba_traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080" # dashboard
    networks:
      - laba_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./dynamic:/dynamic:ro
      - ./logs:/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.entrypoints=http"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
    environment:
      - TZ=UTC

  # Redis cache shared between services (laba_client.global_cache): the owner service writes,
  # the others read. Services reach it on laba_network: REDIS_CACHE_DSN=redis://laba_redis:6379.
  # A cache only: nothing is saved to disk, a restart starts it empty.
  laba_redis:
    image: redis:8.8.4-alpine
    container_name: laba_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379" # for GUI clients on the host
    networks:
      - laba_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Web UI of laba_redis: keys, values, TTL, edit/delete. http://redis.localhost
  # The laba_redis connection is preconfigured (RI_REDIS_*); its settings are kept in a volume.
  laba_redisinsight:
    image: redis/redisinsight:3.10.1
    container_name: laba_redisinsight
    restart: unless-stopped
    depends_on:
      laba_redis:
        condition: service_healthy
    environment:
      - RI_REDIS_HOST=laba_redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=laba_redis
    volumes:
      - laba_redisinsight:/data
    networks:
      - laba_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redisinsight.entrypoints=http"
      - "traefik.http.routers.redisinsight.rule=Host(`redis.localhost`)"
      - "traefik.http.services.redisinsight.loadbalancer.server.port=5540"

  # A mailbox of every email the services send in development (notification: MAILER_DSN=smtp://laba_mailpit:1025):
  # nothing leaves the machine. http://mail.localhost; the mails are kept in memory, a restart empties it.
  laba_mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: laba_mailpit
    restart: unless-stopped
    networks:
      - laba_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.entrypoints=http"
      - "traefik.http.routers.mailpit.rule=Host(`mail.localhost`)"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  # The message broker of the events between services (RabbitMQ, AMQP; Symfony Messenger: symfony/amqp-messenger): a
  # service publishes to an exchange of its events (profile.events of auth), every service that follows them binds a
  # queue of its own to it. The messages are kept on disk (a volume): a restart loses none. Services:
  # amqp://<user>:<password>@laba_rabbitmq:5672/%2f (EVENTS_TRANSPORT_DSN); management UI: http://rabbitmq.localhost.
  # The credentials of development are those of .env (RABBITMQ_USER, RABBITMQ_PASSWORD), as the databases' root/root.
  laba_rabbitmq:
    image: rabbitmq:4.4.1-management-alpine
    container_name: laba_rabbitmq
    hostname: laba_rabbitmq # the data of RabbitMQ are kept per node name: a fixed one keeps them across recreations
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-laba}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-laba}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672" # AMQP for clients on the host
    volumes:
      - laba_rabbitmq:/var/lib/rabbitmq
    networks:
      - laba_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.entrypoints=http"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

volumes:
  laba_redisinsight:
    name: laba_redisinsight
  laba_rabbitmq:
    name: laba_rabbitmq
